<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d2a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bAnAnArAmA">
<link rel="manifest" href="manifest.webmanifest">

<style>html, body { margin: 0; padding: 0; } body { -webkit-tap-highlight-color: transparent; }</style>
<title>bAnAnArAmA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: full-screen comic panel. The jungle canvas fills the whole phone screen, scores float on top, start and game-over cards sit in the middle. Single jungle theme by choice. */
:root {
  --jungle: #0d2a1a;
  --banana: #ffd23f;
  --ink: #111111;
  --cream: #fff6dc;
  --leaf: #8be06a;
  --display: "Bangers", Impact, "Arial Black", sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--jungle);
  color: var(--cream);
  font-family: var(--body);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
.field { position: fixed; inset: 0; background: #43c6f5; container-type: size; }

canvas { display: block; width: 100%; height: 100%; }
.hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-inline: 16px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-family: var(--display); font-size: 18px; letter-spacing: .06em;
  color: var(--cream); text-shadow: 2px 2px 0 var(--ink);
  pointer-events: none;
}
.hud b {
  font-weight: 400; font-size: 34px; margin-left: 6px;
  color: var(--banana);
  -webkit-text-stroke: 1.5px var(--ink);
  text-shadow: 3px 3px 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.hp {
  position: absolute; left: 16px; right: 16px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: flex; align-items: center; gap: 8px;
  pointer-events: none;
  font-family: var(--display);
}
.hp .heart { font-size: 24px; line-height: 1; color: #ff4d5e; -webkit-text-stroke: 1.5px var(--ink); text-shadow: 2px 2px 0 var(--ink); }
.hp .bar { flex: 1; height: 14px; border: 2px solid var(--ink); background: rgba(17,17,17,0.45); box-shadow: 2px 2px 0 var(--ink); overflow: hidden; }
.hp .bar i { display: block; height: 100%; width: 100%; background: #5fd23a; transition: width .25s ease-out, background-color .25s; }
.hp b { font-weight: 400; font-size: 20px; min-width: 2.2em; text-align: right; color: var(--cream); -webkit-text-stroke: 1px var(--ink); text-shadow: 2px 2px 0 var(--ink); font-variant-numeric: tabular-nums; }
.hp.low .heart { animation: beat .6s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.3); } }
@media (prefers-reduced-motion: reduce) { .hp.low .heart { animation: none; } }
#sound {
  pointer-events: auto;
  font-family: var(--display); font-size: 17px; letter-spacing: .06em;
  background: var(--cream); color: var(--ink);
  border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  padding: 3px 10px; cursor: pointer;
}
#sound[aria-pressed="false"] { background: var(--leaf); text-decoration: line-through; }
#sound:focus-visible { outline: 3px solid var(--banana); outline-offset: 2px; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding-inline: 24px;
  background: color-mix(in srgb, var(--jungle) 55%, transparent);
}
.overlay[hidden] { display: none; }
.overlay #howto[hidden] { display: none; }
.overlay #controls, .overlay #howto { font-size: 22px; padding: 5px 22px; background: #6f6f6f; color: #ffffff; border-color: var(--ink); }
.overlay h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 44px; letter-spacing: .04em; color: var(--banana); -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--ink); }
#ctrlScreen .hint { font-size: 16px; line-height: 1.75; margin-inline: 0; color: var(--cream); }
.overlay #back {
  position: absolute; left: 16px; top: calc(env(safe-area-inset-top, 0px) + 64px);
  width: 48px; height: 48px; padding: 0; display: grid; place-items: center;
  background: var(--cream); color: var(--ink); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
}
.overlay h1 {
  margin: 0;
  font-family: var(--display); font-weight: 400;
  font-size: 58px; letter-spacing: .04em; line-height: 1;
  color: var(--banana);
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 4px 4px 0 var(--ink);
  transform: rotate(-3deg);
}
.overlay h1 .lc { font-size: 0.72em; }   /* the comic font only has capitals: lower-case letters are drawn smaller */
.overlay p { margin: 0; font-size: 16px; line-height: 1.45; max-width: 28ch; text-shadow: 0 2px 0 var(--ink); }
#msg { white-space: pre-line; max-width: none; font-size: 15px; margin-inline: -12px; }
.overlay .hint { font-size: 12px; color: var(--leaf); white-space: pre-line; max-width: none; line-height: 1.55; margin-inline: -12px; }
.overlay button {
  font-family: var(--display); font-size: 30px; letter-spacing: .06em;
  background: var(--banana); color: var(--ink);
  border: 3px solid var(--ink); padding: 8px 28px; cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
}
.overlay button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.overlay button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
.overlay .styles { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--leaf); }
.overlay .style-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.overlay .style-row button {
  font-family: var(--body); font-weight: 900; font-size: 14px; letter-spacing: 0;
  background: var(--cream); color: var(--ink);
  border: 2px solid var(--ink); padding: 5px 10px; box-shadow: 2px 2px 0 var(--ink);
}
.overlay .style-row button[aria-pressed="true"] { background: var(--banana); }
@media (prefers-reduced-motion: reduce) { .overlay h1 { transform: none; } }
/* landscape screens are short: keep the start card compact */
@container (max-height: 560px) {
  .overlay { gap: 8px; }
  .overlay h1 { font-size: 40px; }
  .overlay p { font-size: 13px; line-height: 1.35; max-width: 64ch; }
  .overlay .hint { display: none; }
  .overlay button { font-size: 24px; padding: 4px 24px; }
  .overlay .styles { flex-direction: row; gap: 8px; }
  .overlay .style-row button { font-size: 13px; padding: 3px 8px; }
}
</style>

</head>
<body>
<div class="field">
  <canvas id="cv"></canvas>
  <div class="hud">
    <span>Score<b id="score">0</b></span>
    <button id="sound" type="button" aria-pressed="true">Sound on</button>
    <span>Best<b id="best">0</b></span>
  </div>
  <div class="hp" id="hp" aria-label="Life">
    <span class="heart" aria-hidden="true">&#9829;</span>
    <div class="bar"><i id="hpFill"></i></div>
    <b id="hpNum">100</b>
  </div>
  <div class="overlay" id="overlay">
    <h1 id="title"><span class="lc">b</span>A<span class="lc">n</span>A<span class="lc">n</span>A<span class="lc">r</span>A<span class="lc">m</span>A</h1>
    <p id="msg">Run as far as you can!
Don’t bump into walls, don’t step into shit!
Tourists are deadly – avoid or charge at them!
Bananas give 3 HP, the toucan’s treats give full life – look for them in the trees.</p>
    <button id="start" type="button">Let's go!</button>
    <button id="howto" type="button" hidden>How To</button>
    <button id="controls" type="button">Controls</button>
  </div>
  <div class="overlay" id="ctrlScreen" hidden>
    <button id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>Controls</h2>
    <p class="hint" id="hint"></p>
  </div>
</div>

      if ((onFloorPile || onRoofPile) && p.x + W > tx + 0.2 && p.x < tx + 0.8) {   // stepping right into the poo: no bounce, just mess
        var sdmg = 45, py0 = onFloorPile ? c.g : c.ch;
        if (onFloorPile) c.squash = true; else c.rsquash = true;
        hp = Math.max(0, hp - sdmg); hurtT = 0.9;
        pop(tx + 0.5, py0 + 2, "PLATSCH!", true); pop(p.x + W / 2, p.y + H + 1.6, "-" + sdmg, false, "#ff5a5a");
        for (var sq = 0; sq < 14; sq++) dust.push({ x: tx + 0.5 + (Math.random() - 0.5) * 0.6, y: py0 + 0.3, r: 0.1 + Math.random() * 0.14,
          vx: (Math.random() - 0.3) * 7, vy: 3 + Math.random() * 6, life: 0.5 + Math.random() * 0.4, c: "#6e3f1c" });
        splatScreen(); shake = 0.15; buzz(60); sfx("splat");

      }
      for (var i = c.coins.length - 1; i >= 0; i--) {
        var cy = c.coins[i];

  function updateFx(dt) {
    shake = Math.max(0, shake - dt);
    flashA = Math.max(0, flashA - dt * 2.2);
    for (var si = splats.length - 1; si >= 0; si--) { splats[si].t += dt; if (splats[si].t > splats[si].life) splats.splice(si, 1); }
    hurtT = Math.max(0, hurtT - dt);
    if (hp !== hpDrawn) {
      hpDrawn = hp;
      hpFill.style.width = hp + "%";
      hpFill.style.backgroundColor = hp > 60 ? "#5fd23a" : hp > 30 ? "#ffc93c" : "#ff4d5e";
      hpNum.textContent = hp;
      hpBox.classList.toggle("low", hp <= 30);
    }
    if (p) {
      var dc = col(Math.floor(p.x + W / 2)), sref = dc.cl !== null ? dc.ch : dc.shaft !== null ? dc.shaft : (dc.g === null ? p.y : dc.g);
      var dep = dc.cl !== null || dc.shaft !== null ? clamp((sref - p.y - 2) / 14, 0, 1) : 0;
      dark += (dep - dark) * Math.min(1, dt * 2.5);
      skyVis += (clamp((camY + VH - sref) / 4, 0, 1) - skyVis) * Math.min(1, dt * 4);
    }
    camRef += (camY - camRef) * Math.min(1, dt * 0.4);
    var i;
    for (i = dust.length - 1; i >= 0; i--) {
      var d = dust[i];

    if (state === "run") { updateTreats(dt); updateToucan(dt); }

    if (birdT <= 0) {
      birds.push({ x: cw + k, y: ch * (0.12 + Math.random() * 0.3), v: k * (1.2 + Math.random()), ph: Math.random() * 6, pal: Math.random() < 0.5 ? C.parrot : C.parrot2, s: 0.7 + Math.random() * 0.5 });

    }
    for (i = birds.length - 1; i >= 0; i--) {

  }

  // ---------- toucan sidekick and treats in the trees ----------
  function treeCrown(i) {
    var sw = k * 3.6, off = camX * k * 0.32;
    return { x: i * sw - off + hash(i + 1) * k * 1.2, y: ch * (0.22 + hash(i + 3) * 0.16) + bgOff(0.32) };
  }
  function itemPos(it) { var c = treeCrown(it.i); return { x: c.x + it.dx * k, y: c.y + it.dy * k }; }
  function updateTreats(dt) {
    var i;
    itemT -= dt;
    if (itemT <= 0 && items.length < 2 && skyVis > 0.6) {
      var sw = k * 3.6, first = Math.floor((camX * k * 0.32 + cw + k) / sw);
      for (i = first; i < first + 4; i++) if (hash(i * 2.7) >= 0.3) {
        items.push({ i: i, kind: Math.random() < 0.5 ? "berry" : "nut", dx: (Math.random() - 0.5) * 1.4, dy: -0.3 + Math.random() * 0.9, taken: false });
        break;
      }

    }
    items = items.filter(function (it) { return !it.taken && itemPos(it).x > -k * 2; });
  }
  function screenToWorld(x, y) { return { x: camX + x / k, y: camY + (ch - y) / k }; }
  function startCharge() {

    p.chg = { t: 0, go: false }; held = false; buffer = 0; pendingJump = false;
    sfx("drum"); sfx("roar"); pop(p.x + W / 2, p.y + H + 1, "TROMMEL!", false, "#ffffff");   // the scream starts with the chest beat
  }
  function sendToucan() {

    } else underT += dt;

    if (tc.mode === "perch") return;
    tc.t += dt;

  function die(why) {
    stopRoar();

    if (p.sw) p.sw = null;
    p.vy = 14;

    msgEl.textContent = why;
  }

  function finish() {

    }
    titleEl.textContent = record && score > 0 ? "New record!" : "Game Over";
    msgEl.textContent += " " + coins + (coins === 1 ? " banana, " : " bananas, ") + treats + (treats === 1 ? " toucan treat, " : " toucan treats, ") + score + " points.";
    startBtn.textContent = "Again!";

  }

  // ---------- drawing helpers ----------
  function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.abs(r), 0, Math.PI * 2); }
  function fillStroke(fill, lw, stroke) {
    ctx.fillStyle = fill; ctx.fill();
    if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke || INK; ctx.stroke(); }
  }
  function bgOff(f) { return clamp((camY - camRef) * k * f * 2, -ch * 0.12, ch * 0.12); }

  function burst(x, y, r, n, fill) {
    ctx.beginPath();
    for (var i = 0; i < n * 2; i++) {
      var a = i / (n * 2) * Math.PI * 2, rr = i % 2 ? r * 0.6 : r * (0.9 + hash(i + n) * 0.2);

    fillStroke(fill, k * 0.07);
  }
  function comicText(text, x, y, size, fill) {
    ctx.font = size + "px Bangers, Impact, 'Arial Black', sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.lineWidth = size * 0.2; ctx.strokeStyle = INK; ctx.strokeText(text, x, y);
    ctx.fillStyle = fill; ctx.fillText(text, x, y);
  }

  // ---------- background ----------
  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, ch);
    g.addColorStop(0, C.sky1); g.addColorStop(0.55, C.sky2); g.addColorStop(1, C.sky3);
    ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    // comic sun
    var sx = cw * 0.8, sy = ch * 0.17 + bgOff(0.03), sr = k * 1.2;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(anim * 0.15);
    ctx.fillStyle = C.ray;
    for (var i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath(); ctx.moveTo(sr * 1.15, -sr * 0.18); ctx.lineTo(sr * 2.3, 0); ctx.lineTo(sr * 1.15, sr * 0.18); ctx.fill();
    }
    ctx.restore();
    circ(sx, sy, sr); fillStroke(C.sun, k * 0.07);
    // halftone dots
    if (dots) { ctx.globalAlpha = 0.22; ctx.fillStyle = dots; ctx.fillRect(0, ch * 0.4, cw, ch * 0.6); ctx.globalAlpha = 1; }
  }

  function drawMountains() {
    var off = camX * k * 0.06, sw = k * 3.2, oy = bgOff(0.06), base = ch * 0.7 + oy;
    var first = Math.floor(off / sw) - 1, n = Math.ceil(cw / sw) + 3, i, x, peaks = [];
    ctx.beginPath(); ctx.moveTo(-10, ch);
    for (i = first; i < first + n; i++) {
      x = i * sw - off;
      var py = base - (0.2 + hash(i) * 0.24) * ch, vy = base - hash(i + 0.5) * 0.06 * ch;
      ctx.lineTo(x, vy); ctx.lineTo(x + sw * (0.4 + hash(i + 3) * 0.2), py);

    }
    ctx.lineTo(cw + 10, ch); ctx.closePath();
    ctx.fillStyle = C.mount; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = C.mountL;
    peaks.forEach(function (q) {

  }

  function drawCliffs() {
    var off = camX * k * 0.16, sw = k * 5.5, oy = bgOff(0.16);
    var first = Math.floor(off / sw) - 1, n = Math.ceil(cw / sw) + 3;
    for (var i = first; i < first + n; i++) {

      var x = i * sw - off + hash(i) * k, wd = k * (1.8 + hash(i + 2) * 1.3);

    }
  }

  function drawBirds() {

      ctx.save(); ctx.translate(b.x, b.y + Math.sin(b.ph * 0.3) * k * 0.2); ctx.scale(-1, 1);

  function drawTrees() {
    var off = camX * k * 0.32, sw = k * 3.6, oy = bgOff(0.32);

  // Monkeys travelling through the background trees hand over hand: swing on a tree's vine, let go,

    }
    drawFx();
    if (skyVis > 0.02) { ctx.globalAlpha = skyVis; drawCanopy(); ctx.globalAlpha = 1; }
    if (style === "aquarell" && grainPattern) {        // the whole picture sits on watercolour paper
      ctx.fillStyle = "rgba(255,240,215,0.07)"; ctx.fillRect(0, 0, cw, ch);
      ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, cw, ch);
    }
    ctx.restore();
    drawSplats();                                      // on the "lens", so it doesn't shake with the world
    if (flashA > 0.01) { ctx.fillStyle = "rgba(255,255,240," + flashA.toFixed(3) + ")"; ctx.fillRect(0, 0, cw, ch); }   // camera flash
  }

  // ---------- loop ----------
  function frame(t) {
    var dt = Math.min(0.05, (t - (last || t)) / 1000);
    last = t;
    if (state === "run" && pendingJump && touch0 && performance.now() - touch0.t > 70) { pendingJump = false; press(); }
    if (state === "run") {
      var n = Math.ceil(dt / 0.008), h = dt / n;
      for (var i = 0; i < n && state === "run"; i++) step(h);
    } else if (state === "dying") {
      p.vy -= G * 0.7 * dt; p.y += p.vy * dt; anim += dt;
      deadTimer -= dt;
      if (deadTimer <= 0) finish();
    } else anim += dt;
    updateFx(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // "How To" on the game-over screen only takes you back to the very first menu (title, intro text, Let's go!)
  var howtoBtn = document.getElementById("howto"), titleHTML = titleEl.innerHTML;
  howtoBtn.addEventListener("click", function () {
    titleEl.innerHTML = titleHTML; msgEl.textContent = HELP[ctrl].msg; startBtn.textContent = "Let's go!"; howtoBtn.hidden = true;
  });
  function start() {
    howtoBtn.hidden = true;
    audioInit(); sfx("start"); musicStart();
    reset();
    overlay.hidden = true;
    state = "run"; last = 0;
  }
  function pause() {
    if (state !== "run") return;
    state = "paused"; held = false; wantDuck = false; pendingJump = false; touch0 = null; musicStop();
    titleEl.textContent = "Pause";
    msgEl.textContent = "Tap Continue to carry on.";
    startBtn.textContent = "Continue"; howtoBtn.hidden = true;
    overlay.hidden = false;
  }
  startBtn.addEventListener("click", function () {
    if (state === "paused") { overlay.hidden = true; state = "run"; last = 0; audioInit(); musicStart(); }
    else start();
  });

  // ---------- input ----------
  // On the ground a touch waits 70 ms: a downward swipe in that time ducks instead of jumping.
  function press() {
    if (state !== "run") return;
    held = true; buffer = 0.12;
    if (!p.ground && !p.sw && grabCd <= 0) tryGrab();
  }
  function releaseInput() { held = false; }
  function gameXY(x, y) { return [x, y]; }
  function down(sx, sy) {
    if (state !== "run") return;
    var gxy = gameXY(sx, sy), x = gxy[0], y = gxy[1];
    var now = performance.now();
    if (lastTapUp > 0 && now - lastTapUp < 300) {           // double tap: send the toucan instead of jumping again
      lastTapUp = -1; pendingJump = false;
      touch0 = { x: x, y: y, t: now, dbl: true };
      sendToucan();
      return;
    }
    touch0 = { x: x, y: y, t: now };
    if (ctrl === "swipe") {                                  // jumps come from the swipe; a touch in the air only reaches for vines
      if (!p.ground && !p.sw) { held = true; if (grabCd <= 0) tryGrab(); }
      return;
    }
    if (p.ground && !p.sw) pendingJump = true; else press();
  }
  // Swipe controls: once the finger has moved 24 px the swipe is read.
  // Up to 57 degrees right of straight up = jump (0 = at running speed, 45 = a little further),
  // flatter to the right = charge, downwards = duck. A faster swipe jumps higher and further.
  function swipeMove(x, y) {
    var dx = x - touch0.x, dy = touch0.y - y, dist = Math.hypot(dx, dy);
    if (touch0.sw || dist < 24) return;
    touch0.sw = true;
    var ang = Math.atan2(dx, dy) * 180 / Math.PI;
    if (ang > -30 && ang <= 57) {
      var a = clamp(ang, 0, 45), v = dist / Math.max(16, performance.now() - touch0.t);   // px per ms
      var power = clamp((v - 0.3) / 1.4, 0, 1), h = 2.6 + power * 2;   // never more than a fully held tap jump
      var vx = speed() * (1 + 0.2 * a / 45) * (0.95 + power * 0.1);    // always running on: straight up still moves forward
      p.nextJump = { vy: Math.sqrt(2 * G * h), vx: vx }; buffer = 0.12;
      held = true;                                           // keep the finger down to catch a vine
    } else if (ang > 57 && ang < 125) {
      held = false; buffer = 0; startCharge();
    } else if (Math.abs(ang) >= 125) {
      wantDuck = true; held = false; buffer = 0;
    }
  }
  function move(sx, sy) {
    if (!touch0 || state !== "run") return;
    var gxy = gameXY(sx, sy), x = gxy[0], y = gxy[1];
    if (p.sw && held) return vineMove(x, y);
    if (ctrl === "swipe") return swipeMove(x, y);
    if (x - touch0.x > 40 && x - touch0.x > Math.abs(y - touch0.y) * 1.5 && !touch0.sw) {   // swipe to the right: chest beat and charge
      touch0.sw = true; pendingJump = false; held = false; buffer = 0; startCharge(); return;
    }
    if (y - touch0.y > 18 && !wantDuck && !touch0.sw) { pendingJump = false; wantDuck = true; held = false; buffer = 0; }
  }
  function up() {
    if (pendingJump) { pendingJump = false; press(); }
    var now = performance.now();
    lastTapUp = touch0 && !touch0.dbl && !touch0.sw && !wantDuck && now - touch0.t < 250 ? now : -1;
    touch0 = null; wantDuck = false; held = false;
  }
  function onButton(e) { return e.target && e.target.closest && e.target.closest("button"); }
  document.addEventListener("touchstart", function (e) {
    if (onButton(e)) return;
    if (state === "run") e.preventDefault();
    if (!touch0) down(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    if (state === "run") e.preventDefault();
    if (touch0) move(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }, { passive: false });
  document.addEventListener("touchend", function (e) { if (e.touches.length === 0) up(); });
  document.addEventListener("touchcancel", up);
  document.addEventListener("mousedown", function (e) { if (!onButton(e)) down(e.clientX, e.clientY); });
  document.addEventListener("mousemove", function (e) { if (e.buttons & 1) move(e.clientX, e.clientY); });
  document.addEventListener("mouseup", up);
  document.addEventListener("keydown", function (e) {
    if (state === "run" && p.sw) {                         // on a vine: arrows pump and climb
      var vk = { ArrowLeft: [0, -1], a: [0, -1], ArrowRight: [0, 1], d: [0, 1], ArrowUp: [1, -0.5], ArrowDown: [1, 0.5], s: [1, 0.5] }[e.key];
      if (vk) { e.preventDefault(); if (vk[0]) vineClimb(vk[1]); else vinePump(vk[1]); return; }
    }
    if (e.key === " " || e.key === "ArrowUp" || e.key === "w") {
      e.preventDefault();
      if (state === "run") { if (!e.repeat) press(); }
      else if (!ctrlScreen.hidden) document.getElementById("back").click();
      else if (state !== "dying") startBtn.click();
    } else if (e.key === "ArrowRight" || e.key === "d") {
      e.preventDefault(); startCharge();
    } else if ((e.key === "t" || e.key === "T") && state === "run") {
      sendToucan();
    } else if (e.key === "ArrowDown" || e.key === "s") {
      e.preventDefault();
      wantDuck = true; held = false; buffer = 0;
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === " " || ((e.key === "ArrowUp" || e.key === "w") && !p.sw)) releaseInput();
    if (e.key === "ArrowDown" || e.key === "s") wantDuck = false;
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });
  window.addEventListener("resize", resize);

  // Title music in the start menu. Browsers only allow sound after the first touch, click or key,
  // so it is tried right away and again on the first interaction with the page.
  function menuMusic() {
    if (state !== "idle" && state !== "over") return;
    audioInit(); musicStart();
    if (AC && AC.state !== "running") {                         // iPhones unlock sound only with a sound played inside a tap
      try { var src = AC.createBufferSource(); src.buffer = AC.createBuffer(1, 1, 22050); src.connect(AC.destination); src.start(0); } catch (e) {}
      return;
    }                 // not unlocked yet: keep listening
    ["pointerdown", "pointerup", "touchstart", "touchend", "click", "keydown"].forEach(function (ev) {
      document.removeEventListener(ev, menuMusic, { capture: true });
    });
  }
  ["pointerdown", "pointerup", "touchstart", "touchend", "click", "keydown"].forEach(function (ev) {
    document.addEventListener(ev, menuMusic, { capture: true, passive: true });
  });
  menuMusic();

  renderStyles();
  renderCtrl();
  reset();
  resize();
  requestAnimationFrame(frame);
})();
</script>

<script>
  // offline support: once loaded, the game also starts without internet
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
</body>
</html>
